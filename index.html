<!doctype html>
<html lang="nl">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Toms Tools — persoonlijk dashboard met budget, scrum board, doelen, gewoontes en notities. Alles blijft lokaal in je browser."
    />
    <meta name="theme-color" content="#f6f3ec" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#15161a" media="(prefers-color-scheme: dark)" />
    <link rel="apple-touch-icon" href="/toms-tools/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Toms Tools" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <title>Toms Tools</title>
  </head>
  <body>
    <script>
      // Applied before first paint so an explicit light/dark choice never
      // flashes the opposite theme on load.
      try {
        var storedTheme = JSON.parse(localStorage.getItem('toms-tools:theme'));
        if (storedTheme === 'light' || storedTheme === 'dark') {
          document.documentElement.setAttribute('data-theme', storedTheme);
          document.documentElement.style.colorScheme = storedTheme;
        }
      } catch (e) {}
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
